<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RemoteCN 首页 · 方向 B v16</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --peach: #ffd9b8; --peach-2: #ffe8d4; --cream: #fffaf5;
    --ink: #17120e; --ink-2: #4a3f36; --muted: #8a7b6e; --line: #e9ddd1;
    --orange: #ff8a1f; --orange-d: #e06c00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Space Grotesk", "Noto Sans SC", "PingFang SC", system-ui, sans-serif; font-weight: 500; background: var(--cream); color: var(--ink); -webkit-font-smoothing: antialiased; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 24px; }
  button { font: inherit; cursor: pointer; }

  /* Header */
  header.top { position: sticky; top: 0; z-index: 20; background: rgba(255,217,184,.85); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(23,18,14,.08); }
  header.top .wrap { height: 64px; display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 4px; font-weight: 700; font-size: 24px; letter-spacing: -.04em; text-decoration: none; color: var(--ink); }
  .logo em { font-style: normal; background: var(--orange); border: 2px solid var(--ink); border-radius: 8px; padding: 0 6px 1px; box-shadow: 0 3px 0 var(--ink); transform: rotate(-4deg); margin-left: 3px; font-size: 20px; transition: .2s; }
  .logo:hover em { transform: rotate(3deg); }
  .nav { display: flex; gap: 26px; font-size: 15px; font-weight: 500; color: var(--ink-2); }
  .actions { display: flex; gap: 10px; align-items: center; }
  .btn { border: 2px solid var(--ink); border-radius: 10px; padding: 7px 14px; font-weight: 600; font-size: 14px; background: #fff; color: var(--ink); box-shadow: 0 3px 0 var(--ink); transition: .12s; }
  .btn:hover { transform: translateY(1px); box-shadow: 0 2px 0 var(--ink); }
  .btn.primary { background: var(--orange); }
  .ghost { background: none; border: 0; font-weight: 600; font-size: 14px; color: var(--ink); }

  /* Hero */
  .hero { position: relative; overflow: hidden; background: linear-gradient(180deg, var(--peach) 0%, var(--peach-2) 70%, var(--cream) 100%); }
  .wall { position: absolute; inset: -10px 0 0; display: flex; flex-direction: column; gap: 12px; transform: rotate(-3deg) scale(1.08); }
  .wall::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 44% 58% at 50% 52%, var(--peach) 0%, rgba(255,217,184,.94) 50%, rgba(255,217,184,0) 100%); pointer-events: none; }
  .lane { display: flex; gap: 16px; width: max-content; animation: slide var(--d, 80s) linear infinite; }
  .lane.rev { animation-direction: reverse; }
  .wall:hover .lane { animation-play-state: paused; }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .chip { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 13px; background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.8); white-space: nowrap; color: #9c8572; transition: .2s; text-decoration: none; }
  .chip:hover { background: #fff; color: var(--ink); transform: translateY(-2px) rotate(-1deg); box-shadow: 0 8px 20px -8px rgba(120,60,10,.35); }
  .chip.cat { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .chip.cat .em { font-size: 16px; filter: saturate(.6); }
  .chip.kw { font-family: "JetBrains Mono", monospace; font-size: 14px; font-weight: 500; height: 38px; margin-top: 3px; background: rgba(255,255,255,.35); }
  .chip .n { font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 400; opacity: .7; }
  .hero-c { position: relative; z-index: 2; text-align: center; padding-top: 44px; padding-bottom: 40px; }
  .badge { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 6px 12px 6px 8px; border-radius: 999px; background: rgba(255,255,255,.75); border: 1px solid rgba(23,18,14,.1); }
  .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; box-shadow: 0 0 0 3px #16a34a33; }
  h1 { font-size: clamp(30px, 4.4vw, 50px); font-weight: 700; letter-spacing: -.035em; line-height: 1.04; }
  .sub { margin: 12px auto 0; max-width: 620px; font-size: 16px; color: var(--ink-2); line-height: 1.6; }
  .search { margin: 26px auto 0; max-width: 900px; display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr auto; align-items: center; background: #fff; border: 2px solid var(--ink); border-radius: 22px; text-align: left; }
  .seg { display: flex; gap: 12px; align-items: center; padding: 10px 18px; border-right: 1px solid var(--line); min-width: 0; }
  .seg svg { flex: none; color: var(--ink-2); }
  .seg label { display: block; font-size: 12.5px; font-weight: 700; }
  .seg .v { font-size: 14.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg .v.set { color: var(--ink); }
  .go { margin: 6px; height: 46px; padding: 0 22px; border-radius: 14px; border: 2px solid var(--ink); background: var(--orange); font-weight: 700; font-size: 15px; display: flex; gap: 8px; align-items: center; }
  .below { margin-top: 18px; display: flex; justify-content: center; align-items: center; gap: 16px; font-size: 14.5px; color: var(--ink-2); flex-wrap: wrap; }
  .below b { color: var(--ink); }
  .below a { color: var(--ink); font-weight: 600; text-decoration: none; }

  /* List */
  .main { display: grid; grid-template-columns: 250px 1fr; gap: 36px; padding: 40px 24px 80px; }
  aside { position: sticky; top: 88px; align-self: start; }
  .count { font-size: 15px; color: var(--ink-2); display: flex; justify-content: space-between; align-items: center; }
  .count b { font-size: 22px; color: var(--ink); font-weight: 700; }
  .clear { font-size: 13px; padding: 5px 10px; border-radius: 8px; background: #f3ebe3; border: 0; color: var(--ink-2); }
  .grp { margin-top: 26px; }
  .grp h4 { font-size: 13px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .opt { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; margin: 0 -10px; border-radius: 9px; font-size: 14.5px; color: var(--ink-2); cursor: pointer; }
  .opt:hover { background: #f6eee6; }
  .opt.on { background: #fff; color: var(--ink); font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--ink); }
  .opt .n { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--muted); font-weight: 400; }
  .toggle { display: flex; align-items: center; gap: 12px; font-size: 14.5px; color: var(--ink-2); padding: 6px 0; }
  .sw { width: 36px; height: 22px; border-radius: 999px; background: #e7dcd1; position: relative; flex: none; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .sw.on { background: var(--orange); }
  .sw.on::after { left: 17px; }

  .listhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .sort { font-size: 14px; color: var(--ink-2); }
  .sort b { color: var(--ink); }
  .card { display: grid; grid-template-columns: 56px 1fr auto; gap: 18px; padding: 22px; background: #fff; border: 1px solid var(--line); border-radius: 18px; margin-bottom: 14px; transition: .18s; cursor: pointer; }
  .card:hover { border-color: var(--ink); box-shadow: 0 4px 0 var(--ink); transform: translateY(-2px); }
  .av { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; font-size: 26px; }
  .card h3 { font-size: 18.5px; font-weight: 700; font-family: "Space Grotesk", "Noto Sans SC", sans-serif; letter-spacing: -.01em; line-height: 1.35; }
  .card h3 .arr { color: var(--muted); font-weight: 400; margin-left: 4px; }
  .co { margin-top: 4px; font-size: 15px; font-weight: 600; color: var(--ink-2); }
  .desc { margin-top: 6px; font-size: 14.5px; color: var(--muted); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .loc { margin-top: 10px; font-size: 12px; letter-spacing: .04em; color: var(--ink-2); text-transform: uppercase; }
  .tags { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-family: "JetBrains Mono", monospace; font-size: 12px; padding: 4px 9px; border-radius: 7px; border: 1px solid var(--line); color: var(--ink-2); }
  .tag.cat { font-family: inherit; font-weight: 600; border-color: transparent; }
  .right { text-align: right; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; gap: 10px; }
  .when { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .when.fresh { color: #15803d; font-weight: 600; }
  .src { font-size: 12px; color: var(--muted); padding: 4px 8px; border-radius: 7px; background: #f7f1eb; white-space: nowrap; }
  .more { display: block; width: 100%; margin-top: 10px; padding: 14px; }

  footer { border-top: 1px solid var(--line); padding: 28px 0 40px; font-size: 13px; color: var(--muted); }

  @media (max-width: 860px) {
    .nav { gap: 18px; }
    .search { grid-template-columns: 1fr; border-radius: 20px; }
    .seg { border-right: 0; border-bottom: 1px solid var(--line); }
    .go { justify-content: center; }
    .main { grid-template-columns: 1fr; }
    aside { position: static; }
    .grp.cats #cats { display: flex; gap: 8px; overflow-x: auto; margin-top: 16px; padding-bottom: 4px; }
    .grp.cats h4, .grp.hide-m { display: none; }
    .grp.cats .opt { margin: 0; flex: none; border: 1px solid var(--line); background: #fff; }
    .card { grid-template-columns: 44px 1fr; padding: 18px; }
    .av { width: 44px; height: 44px; font-size: 20px; }
    .right { grid-column: 2; flex-direction: row; align-items: center; }
    .hero-c { padding-top: 28px; padding-bottom: 28px; }
    .below .sep { display: none; }
    .below { gap: 8px 14px; font-size: 13.5px; }
    .seg { padding: 8px 16px; }
    .wall::after { background: radial-gradient(ellipse 70% 45% at 50% 42%, var(--peach) 0%, rgba(255,217,184,.94) 60%, rgba(255,217,184,.4) 100%); }
  }

  /* ---- v9: type scale & colors matched to lennysjobs ---- */
  :root { --ink: #0a0a0a; --ink-2: #0a0a0a; --muted: #6b7080; --sep: #a1a1a1; }
  body { font-weight: 400; }
  .nav { font-size: 14px; font-weight: 400; color: var(--ink); }
  .btn, .ghost { font-size: 14px; font-weight: 500; }
  h1 { font-size: clamp(30px, 3.75vw, 48px); font-weight: 700; line-height: 1; letter-spacing: -.01em; }
  .sub { font-size: 16px; font-weight: 300; line-height: 24px; color: var(--ink); margin-top: 14px; }
  .seg label { font-size: 12px; font-weight: 600; line-height: 16px; }
  .seg .v { font-size: 14px; font-weight: 400; line-height: 20px; color: var(--muted); }
  .seg .v.set { color: var(--ink); }
  .go { font-size: 14px; font-weight: 600; }
  .below { font-size: 14px; font-weight: 300; color: var(--muted); }
  .below b { font-weight: 500; }
  .badge { font-size: 12px; font-weight: 500; }
  .count { font-size: 14px; color: var(--muted); }
  .count b { font-size: 14px; font-weight: 600; }
  .clear { font-size: 14px; font-weight: 500; color: var(--muted); }
  .grp h4 { font-size: 16px; font-weight: 600; line-height: 24px; }
  .opt { font-size: 14px; font-weight: 400; color: var(--muted); }
  .opt.on { color: var(--ink); font-weight: 500; }
  .opt .n { font-size: 11px; color: var(--sep); }
  .toggle { font-size: 14px; font-weight: 400; color: var(--ink); }
  .sort { font-size: 14px; color: var(--muted); }
  .sort b { font-weight: 500; }
  .card h3 { font-size: 18px; font-weight: 700; line-height: 24.75px; letter-spacing: 0; }
  .co { font-size: 16px; font-weight: 500; line-height: 24px; color: var(--ink); margin-top: 2px; }
  .desc { font-size: 14px; font-weight: 400; line-height: 20px; color: var(--muted); }
  .loc { font-family: inherit; font-size: 12px; font-weight: 500; line-height: 16px; letter-spacing: .02em; color: var(--muted); }
  .tag { font-size: 11px; color: var(--muted); }
  .tag.cat { font-size: 12px; font-weight: 500; color: var(--ink); }
  .when { font-size: 12px; font-weight: 400; color: var(--muted); }
  .when.fresh { font-weight: 500; }
  .src { font-size: 12px; color: var(--muted); }
  footer { font-size: 12px; }

  /* ---- v11: load more + footer ---- */
  .main > * { min-width: 0; }
  .loadmore { margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .loadmore p { font-size: 14px; color: var(--muted); }
  .loadmore p b { color: var(--ink); font-weight: 600; }
  .progress { width: 220px; height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .progress span { display: block; height: 100%; background: var(--orange); border-radius: inherit; }
  .loadmore .btn { padding: 10px 26px; }

  footer.site { padding: 0; margin-top: 40px; border-top: 1px solid var(--line); font-size: 14px; }
  .ft { display: flex; justify-content: center; align-items: center; gap: 10px; padding-top: 14px; padding-bottom: 14px; font-size: 12px; color: var(--muted); }
  .ft span { color: var(--sep); }
  .ft a { color: var(--muted); text-decoration: none; }
  .ft a:hover { color: var(--ink); }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="#">remote<em>cn</em></a>
    <nav class="nav"><span style="color:var(--ink)">职位</span><span>关于</span><span>联系我们</span></nav>
  </div>
</header>

<section class="hero">
  <div class="wall" id="wall"></div>
  <div class="wrap hero-c">
    <h1>为中国开发者找远程工作</h1>
    <p class="sub">聚合全网远程开发岗位，AI 自动分类。前端、后端、AI、Web3，一处搜完。</p>
    <div class="search">
      <div class="seg">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <div style="min-width:0"><label>关键词</label><div class="v">React、Go、AI Agent…</div></div>
      </div>
      <div class="seg">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        <div style="min-width:0"><label>职位方向</label><div class="v set">AI/机器学习</div></div>
      </div>
      <div class="seg">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        <div style="min-width:0"><label>地域</label><div class="v">不限</div></div>
      </div>
      <div class="seg">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <div style="min-width:0"><label>工作性质</label><div class="v">全职 / 兼职</div></div>
      </div>
      <button class="go">搜索 <span>→</span></button>
    </div>
    <div class="below"><span class="badge"><span class="dot"></span>每小时更新</span><span>共 <b>417</b> 个在招职位</span></div>
  </div>
</section>

<div class="wrap main">
  <aside>
    <div class="count"><span><b>417</b> 个职位</span><button class="clear">✕ 清除筛选</button></div>
    <div class="grp cats">
      <h4>职位方向</h4>
      <div id="cats"></div>
    </div>
    <div class="grp hide-m">
      <h4>地域</h4>
      <div class="opt on">不限 <span class="n">417</span></div>
      <div class="opt">全球远程 <span class="n">238</span></div>
      <div class="opt">地区限制 <span class="n">179</span></div>
    </div>
    <div class="grp hide-m">
      <h4>快速筛选</h4>
      <div class="toggle"><span class="sw on"></span>只看 7 天内</div>
      <div class="toggle"><span class="sw"></span>只看全职</div>
    </div>
  </aside>

  <section>
    <div class="listhead">
      <span class="sort">排序：<b>最新发布 ▾</b></span>
      <span class="sort mono" style="font-size:12px">最近同步 12 分钟前</span>
    </div>
    <div id="cards"></div>
    <div class="loadmore">
      <div class="progress"><span style="width:4.8%"></span></div>
      <p>已显示 <b>20</b> / 417 个职位</p>
      <button class="btn primary">加载更多职位</button>
    </div>
  </section>
</div>

<footer class="site">
  <div class="wrap ft">© 2025–2026 remotecn<span>·</span><a href="#">隐私政策</a></div>
</footer>

<script>
const CATS = [
  ['🤖','AI/机器学习',64,'#ffe7d1'], ['🧱','后端开发',96,'#e3f0ff'], ['🎨','前端开发',81,'#ffe3ef'], ['🧩','全栈开发',52,'#e9f7e3'],
  ['⛓️','区块链',38,'#f1e8ff'], ['☁️','DevOps',21,'#e0f6f7'], ['📱','移动开发',19,'#fff3cc'], ['🎮','游戏开发',9,'#ffe1e1'],
  ['📈','量化交易',11,'#e6f0e6'], ['🛡️','安全',7,'#ececec'], ['🧪','测试',8,'#f6eadf'], ['📊','大数据',15,'#e3ecff'], ['🔌','嵌入式',6,'#f0f0e0'],
];
const KW = ['React','Go','Python','Rust','TypeScript','LLM','Next.js','Kubernetes','Solidity','Flutter','Node.js','AI Agent','Vue','Java','iOS','RAG','Unity','PostgreSQL','AWS','Swift'];

// Drifting wall: categories (bold, with emoji + count) mixed with keywords (mono)
const wall = document.getElementById('wall');
for (let l = 0; l < 6; l++) {
  const items = [];
  for (let i = 0; i < 12; i++) {
    if ((i + l) % 2 === 0) { const c = CATS[(i * 2 + l * 3) % CATS.length]; items.push(`<a class="chip cat" href="#"><span class="em">${c[0]}</span>${c[1]}<span class="n">${c[2]}</span></a>`); }
    else items.push(`<a class="chip kw" href="#">${KW[(i * 3 + l * 5) % KW.length]}</a>`);
  }
  const html = items.join('');
  wall.insertAdjacentHTML('beforeend', `<div class="lane${l % 2 ? ' rev' : ''}" style="--d:${70 + l * 9}s">${html}${html}</div>`);
}

document.getElementById('cats').innerHTML =
  `<div class="opt">全部 <span class="n">417</span></div>` +
  CATS.slice(0, 9).map((c, i) => `<div class="opt${i === 0 ? ' on' : ''}">${c[0]} ${c[1]} <span class="n">${c[2]}</span></div>`).join('');

const jobs = [
  { t: 'AI 后端工程师（AIGC 方向）', co: '某出海 AIGC 创业公司', d: '负责多模态生成服务的后端架构，包括推理调度、任务队列和计费系统。有 LLM 应用落地经验优先，团队全员远程，弹性工作。', loc: '全球远程 · 全职', cat: [0, 1], tags: ['Python','FastAPI','LLM','Redis'], src: 'V2EX', when: '2 小时前', fresh: true },
  { t: 'Senior Frontend Engineer (React / Next.js)', co: 'Acme Labs', d: 'Build the customer-facing dashboard for our developer platform. You will own the design system and collaborate closely with product and design across time zones.', loc: '亚太时区 · 全职', cat: [2], tags: ['React','TypeScript','Next.js'], src: 'Remote.com', when: '5 小时前', fresh: true },
  { t: 'Rust 区块链核心开发', co: null, d: '参与公链节点与共识模块开发，USDT 结算，薪资面议。需要扎实的 Rust 功底和分布式系统经验。', loc: '全球远程 · 全职', cat: [4], tags: ['Rust','Solana','分布式'], src: '电鸭', when: '1 天前' },
  { t: 'Go 后端开发 / 跨境 SaaS', co: '某跨境电商 SaaS', d: '负责订单与支付相关微服务，日均处理百万级请求。远程办公，每年线下团建两次。', loc: '国内远程 · 全职', cat: [1], tags: ['Go','PostgreSQL','gRPC'], src: '电鸭', when: '1 天前' },
  { t: 'DevOps / SRE 工程师', co: 'CloudNine', d: '维护多云 Kubernetes 集群，建设可观测性和 CI/CD 流水线，参与 on-call 轮值。', loc: '地区限制 · 全职', cat: [5], tags: ['Kubernetes','AWS','Terraform'], src: 'RWFA', when: '2 天前' },
];
document.getElementById('cards').innerHTML = jobs.map(j => {
  const c0 = CATS[j.cat[0]];
  return `<article class="card">
    <div class="av" style="background:${c0[3]}">${c0[0]}</div>
    <div style="min-width:0">
      <h3>${j.t}</h3>
      ${j.co ? `<div class="co">${j.co}</div>` : ''}
      <p class="desc">${j.d}</p>
      <div class="loc">${j.loc}</div>
      <div class="tags">${j.cat.map(i => `<span class="tag cat" style="background:${CATS[i][3]}">${CATS[i][1]}</span>`).join('')}${j.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    </div>
    <div class="right"><span class="when${j.fresh ? ' fresh' : ''}">${j.fresh ? '● ' : ''}${j.when}</span><span class="src">via ${j.src}</span></div>
  </article>`;
}).join('');
</script>
</body>
</html>
