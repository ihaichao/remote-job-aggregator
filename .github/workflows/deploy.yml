name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never run two deploys against the VPS at once; a newer push waits for the current one
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Pull and rebuild on the VPS
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s -- "$DEPLOY_PATH" "$GITHUB_SHA" "https://github.com/$GITHUB_REPOSITORY.git" <<'EOF'
          set -euo pipefail
          cd "$1"
          # .env lives only on the server and is gitignored, so pulling leaves it alone
          # Public repo: fetch over HTTPS so the VPS needs no GitHub key
          git fetch "$3" master
          git checkout master
          git merge --ff-only "$2"
          docker compose up -d --build --remove-orphans
          docker image prune -f
          docker compose ps
          EOF
